name: CareBridge AI CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carebridge/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: carebridge/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

  backend-check:
    name: Backend Test Suite (128 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: carebridge/backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r carebridge/backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Pytest Suite
        env:
          PYTHONPATH: carebridge/backend
          ENVIRONMENT: test
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_KEY: dummy-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          DATABASE_URL: "dummy_database_url"
        run: |
          pytest carebridge/backend/tests/ -v

  secrets-audit:
    name: Secrets & Credentials Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Zero Tracked Env Files
        run: |
          if git ls-files | grep -E "(^|/)\.env($|\..*)"; then
            echo "Error: Tracked .env files found in git history!"
            exit 1
          fi
          echo "No tracked .env files detected. Secrets hygiene PASSED."
