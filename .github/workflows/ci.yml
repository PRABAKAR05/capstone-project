name: CareBridge AI CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  secrets-audit:
    name: Secrets & Credentials Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Zero Tracked Env Files
        run: |
          if git ls-files | grep -E "(^|/)\.env($|\..*)" | grep -v "\.env\.example"; then
            echo "Error: Tracked .env files found in git history!"
            exit 1
          fi
          echo "No tracked .env files detected. Secrets hygiene PASSED."

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carebridge/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: carebridge/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

  backend-check:
    name: Backend Test Suite (128 Tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: carebridge/backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r carebridge/backend/requirements.txt
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest pytest-asyncio pytest-cov httpx

      - name: Initialize PostgreSQL Database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=password psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          PGPASSWORD=password psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
          PGPASSWORD=password psql -h localhost -U postgres -d postgres -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon; END IF; END \$\$;"
          PGPASSWORD=password psql -h localhost -U postgres -d postgres -c "CREATE SCHEMA IF NOT EXISTS auth; CREATE TABLE IF NOT EXISTS auth.users (id UUID PRIMARY KEY, aud VARCHAR(255) DEFAULT 'authenticated', role VARCHAR(255) DEFAULT 'authenticated', email VARCHAR(255) UNIQUE, raw_app_meta_data JSONB DEFAULT '{}', raw_user_meta_data JSONB DEFAULT '{}', created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP);"
          for f in carebridge/backend/supabase/migrations/0*.sql; do
            if [[ "$f" != *"_down.sql"* ]]; then
              echo "Applying migration: $f"
              PGPASSWORD=password psql -h localhost -U postgres -d postgres -f "$f" || true
            fi
          done
          echo "Applying seed data"
          PGPASSWORD=password psql -h localhost -U postgres -d postgres -f carebridge/backend/supabase/seed.sql || true

      - name: Run Pytest Suite
        env:
          PYTHONPATH: ${{ github.workspace }}/carebridge/backend:${{ github.workspace }}
          ENVIRONMENT: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vmuzexvtbodnkzhfitzf.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'dummy-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'dummy-service-role-key' }}
          DATABASE_URL: postgresql://postgres:password@localhost:5432/postgres
        run: |
          python -m pytest carebridge/backend/tests/ -o testpaths=carebridge/backend/tests -v --tb=short > pytest_run.log 2>&1 || true
          cat pytest_run.log
          grep -A 2 -B 2 "FAILED" pytest_run.log | while IFS= read -r line; do
            echo "::error title=TestFailure::$line"
          done
          if grep -q "FAILED" pytest_run.log || grep -q "ERRORS" pytest_run.log; then
            exit 1
          fi
